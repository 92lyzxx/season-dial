name: build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  windows-portable:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build portable exe
        run: npx electron-builder --win portable --x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeasonDial-portable
          path: dist/*.exe
          if-no-files-found: error

      - name: Create or update release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists, attaching assets only."
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "SeasonDial ${GITHUB_REF_NAME#v}" \
              --notes-file CHANGELOG.md
          fi
          gh release upload "${GITHUB_REF_NAME}" dist/*.exe --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
